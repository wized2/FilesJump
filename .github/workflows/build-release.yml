name: Build & Release

on:
  push:
    branches: [main, dev]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Channel
        id: channel
        run: |
          BR="${GITHUB_REF_NAME}"
          if [ "$BR" = "main" ]; then
            echo "name=stable" >> "$GITHUB_OUTPUT"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
            echo "suffix=" >> "$GITHUB_OUTPUT"
          else
            echo "name=beta" >> "$GITHUB_OUTPUT"
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
            echo "suffix=-beta" >> "$GITHUB_OUTPUT"
          fi
          echo "branch=$BR" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Decode release keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          set -e
          if [ -z "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "::error::RELEASE_KEYSTORE_BASE64 secret is missing"
            exit 1
          fi
          echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > "$GITHUB_WORKSPACE/release.jks"
          echo "Keystore OK: $(wc -c < "$GITHUB_WORKSPACE/release.jks") bytes"

      - name: Build signed release APK
        env:
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          set -e
          test -n "$RELEASE_STORE_PASSWORD"
          test -n "$RELEASE_KEY_ALIAS"
          test -n "$RELEASE_KEY_PASSWORD"
          export RELEASE_STORE_FILE="$GITHUB_WORKSPACE/release.jks"
          gradle :app:assembleRelease --no-daemon --stacktrace
          find app/build/outputs -name '*.apk' -ls

      - name: Read version
        id: ver
        run: |
          VN=$(grep -E 'versionName\s*=' app/build.gradle.kts | head -1 | sed -E 's/.*"([^"]+)".*/\1/')
          VC=$(grep -E 'versionCode\s*=' app/build.gradle.kts | head -1 | sed -E 's/[^0-9]//g')
          SUFFIX="${{ steps.channel.outputs.suffix }}"
          echo "name=$VN" >> "$GITHUB_OUTPUT"
          echo "code=$VC" >> "$GITHUB_OUTPUT"
          # Stable: v1.0.0  |  Beta: v1.0.0-beta (or v1.0.0-beta.<run>)
          if [ "${{ steps.channel.outputs.name }}" = "beta" ]; then
            echo "tag=v${VN}-beta.${{ github.run_number }}" >> "$GITHUB_OUTPUT"
            echo "apk=FilesJump-${VN}-beta.${{ github.run_number }}.apk" >> "$GITHUB_OUTPUT"
          else
            echo "tag=v${VN}" >> "$GITHUB_OUTPUT"
            echo "apk=FilesJump-${VN}.apk" >> "$GITHUB_OUTPUT"
          fi

      - name: Prepare APK
        run: |
          mkdir -p dist
          SRC=$(find app/build/outputs/apk -name '*.apk' | head -1)
          test -n "$SRC"
          cp "$SRC" "dist/${{ steps.ver.outputs.apk }}"
          # Verify APK is signed (not debug)
          $ANDROID_HOME/build-tools/*/apksigner verify --print-certs "dist/${{ steps.ver.outputs.apk }}" 2>/dev/null || \
            (command -v apksigner >/dev/null && apksigner verify --print-certs "dist/${{ steps.ver.outputs.apk }}") || \
            (unzip -p "dist/${{ steps.ver.outputs.apk }}" META-INF/*.RSA META-INF/*.DSA META-INF/*.EC 2>/dev/null | head -c 20 | wc -c | grep -qv '^0$')
          ls -la dist/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: FilesJump-${{ steps.channel.outputs.name }}
          path: dist/*.apk

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: FilesJump ${{ steps.ver.outputs.name }}${{ steps.channel.outputs.suffix }} (${{ steps.channel.outputs.name }})
          prerelease: ${{ steps.channel.outputs.prerelease }}
          body: |
            ## FilesJump ${{ steps.ver.outputs.name }} — **${{ steps.channel.outputs.name }}**

            Channel: `${{ steps.channel.outputs.branch }}` branch  
            versionCode: `${{ steps.ver.outputs.code }}`  
            Signed with the project **release** key (same key for stable & beta).

            Home-screen shortcut → AOSP DocumentsUI (Files), excluded from Recents.

            ### Install
            Download **${{ steps.ver.outputs.apk }}** below.

            MIT
          files: dist/${{ steps.ver.outputs.apk }}
          fail_on_unmatched_files: true
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
