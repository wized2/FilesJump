name: Build & Release

on:
  push:
    branches: [main, dev]
  workflow_dispatch:
    inputs:
      release_note:
        description: "Release notes (optional). Overrides release_note.md when set."
        required: false
        type: string
      channel:
        description: "Force channel label (leave empty to use branch: main=stable, dev=beta)"
        required: false
        type: string
        default: ""

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Channel & context
        id: channel
        run: |
          BR="${GITHUB_REF_NAME}"
          FORCE="${{ github.event.inputs.channel }}"
          if [ -n "$FORCE" ]; then
            CH="$FORCE"
          elif [ "$BR" = "main" ]; then
            CH="stable"
          else
            CH="beta"
          fi
          if [ "$CH" = "stable" ]; then
            echo "name=stable" >> "$GITHUB_OUTPUT"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
            echo "suffix=" >> "$GITHUB_OUTPUT"
          else
            echo "name=beta" >> "$GITHUB_OUTPUT"
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
            echo "suffix=-beta" >> "$GITHUB_OUTPUT"
          fi
          echo "branch=$BR" >> "$GITHUB_OUTPUT"

          if [ "${{ github.event.repository.fork }}" = "true" ]; then
            echo "is_fork=true" >> "$GITHUB_OUTPUT"
            echo "Fork build — debug signing"
          else
            echo "is_fork=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Compose release notes
        id: notes
        env:
          INPUT_NOTE: ${{ github.event.inputs.release_note }}
        run: |
          set -e
          OUT="$GITHUB_WORKSPACE/dist-release-body.md"
          mkdir -p "$(dirname "$OUT")"

          {
            echo "## FilesJump — **${{ steps.channel.outputs.name }}**"
            echo ""
            echo "Branch: \`${{ steps.channel.outputs.branch }}\`"
            echo ""
          } > "$OUT"

          if [ -n "$INPUT_NOTE" ]; then
            echo "Using workflow_dispatch release_note input"
            printf '%s\n' "$INPUT_NOTE" >> "$OUT"
          elif [ -f "$GITHUB_WORKSPACE/release_note.md" ]; then
            echo "Using release_note.md"
            cat "$GITHUB_WORKSPACE/release_note.md" >> "$OUT"
          else
            echo "No custom notes — default blurb"
            cat >> "$OUT" << 'DEFAULT'
          Home-screen shortcut → AOSP DocumentsUI (Files), excluded from Recents.
          DEFAULT
          fi

          {
            echo ""
            echo "---"
            echo "Signed with the project release key (stable & beta share the same key)."
            echo ""
            echo "MIT"
          } >> "$OUT"

          echo "path=$OUT" >> "$GITHUB_OUTPUT"
          echo "----- release body preview -----"
          head -40 "$OUT"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Decode release keystore
        id: keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          set -e
          if [ "${{ steps.channel.outputs.is_fork }}" = "true" ]; then
            echo "Skipping release keystore (fork)"
            echo "present=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -z "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "::error::RELEASE_KEYSTORE_BASE64 secret is missing (required on upstream)"
            exit 1
          fi
          echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > "$GITHUB_WORKSPACE/release.jks"
          echo "Keystore OK: $(wc -c < "$GITHUB_WORKSPACE/release.jks") bytes"
          echo "present=true" >> "$GITHUB_OUTPUT"

      - name: Build release APK
        env:
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          set -e
          if [ "${{ steps.keystore.outputs.present }}" = "true" ]; then
            test -n "$RELEASE_STORE_PASSWORD"
            test -n "$RELEASE_KEY_ALIAS"
            test -n "$RELEASE_KEY_PASSWORD"
            export RELEASE_STORE_FILE="$GITHUB_WORKSPACE/release.jks"
            echo "Signing with release key"
          else
            echo "Signing with debug key (fork / no keystore)"
            unset RELEASE_STORE_FILE || true
          fi
          gradle :app:assembleRelease --no-daemon --stacktrace
          find app/build/outputs -name '*.apk' -ls

      - name: Read version
        id: ver
        run: |
          VN=$(grep -E 'versionName\s*=' app/build.gradle.kts | head -1 | sed -E 's/.*"([^"]+)".*/\1/')
          VC=$(grep -E 'versionCode\s*=' app/build.gradle.kts | head -1 | sed -E 's/[^0-9]//g')
          echo "name=$VN" >> "$GITHUB_OUTPUT"
          echo "code=$VC" >> "$GITHUB_OUTPUT"
          if [ "${{ steps.channel.outputs.name }}" = "beta" ]; then
            echo "tag=v${VN}-beta.${{ github.run_number }}" >> "$GITHUB_OUTPUT"
            echo "apk=FilesJump-${VN}-beta.${{ github.run_number }}.apk" >> "$GITHUB_OUTPUT"
          else
            echo "tag=v${VN}" >> "$GITHUB_OUTPUT"
            echo "apk=FilesJump-${VN}.apk" >> "$GITHUB_OUTPUT"
          fi

      - name: Prepare APK
        run: |
          mkdir -p dist
          SRC=$(find app/build/outputs/apk -name '*.apk' | head -1)
          test -n "$SRC"
          cp "$SRC" "dist/${{ steps.ver.outputs.apk }}"
          ls -la dist/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: FilesJump-${{ steps.channel.outputs.name }}
          path: dist/*.apk

      - name: Release
        if: steps.channel.outputs.is_fork != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: FilesJump ${{ steps.ver.outputs.name }}${{ steps.channel.outputs.suffix }} (${{ steps.channel.outputs.name }})
          prerelease: ${{ steps.channel.outputs.prerelease }}
          body_path: ${{ steps.notes.outputs.path }}
          files: dist/${{ steps.ver.outputs.apk }}
          fail_on_unmatched_files: true
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
